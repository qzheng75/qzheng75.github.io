- institution: Georgia Institute of Technology
  location: "Atlanta, GA"
  position: Graduate Research Assistant
  group: Fung Group, CSE
  year: "May 2023 —"
  year-extra: "Now"
  mentors:
    - Victor Fung
  advisor: true
  description: |
    Researching machine learning for materials discovery and simulation in the Fung Group.<br>
    - Developed a <b>physics-informed pretraining</b> strategy for machine learning interatomic potentials, validated across three chemistries (silica, phosphorus, MPTrj) and three architectures (CGCNN, TorchMD, M3GNet); reduced unphysical molecular dynamics artifacts and improved recovery of AIMD trajectories over regularization baselines. First-author paper in <i>JCIM</i>.<br>
    - Built a <b>differentiable geometry toolbox</b> exposing structural properties as autograd-optimizable losses and served it to <b>LLM agents over MCP</b>, reaching 87.5% success on 40 natural-language structure-editing tasks; designed a propose-act-feedback multi-agent system that tripled target band gaps on 9/10 inverse-design tasks.<br>
    - Leading an agentic descriptor-mining project that applies <b>SISSO</b> within an agent framework to discover interpretable descriptors for superconducting critical temperature across ~8,000 conventional superconductors.
  institution-url: https://www.fung-group.org/
  group-url: http://cse.gatech.edu
  type: academic

- institution: Fraunhofer Institute for Wind Energy Systems (IWES)
  location: "Bremen, Germany"
  position: Data Engineering Research Intern
  group: "Wind Energy, Wake Simulation"
  year: "Aug. 2025 —"
  year-extra: "Dec. 2025"
  description: |
    Prepared multi-instrument field measurements for wake model validation in the AWAKEN project.<br>
    - Processed a year of <b>TB-scale, multi-instrument</b> wind measurement data (dual-Doppler radar, lidar, disdrometer, met stations) with <b>NetCDF</b> and <b>Spark</b> pipelines to curate benchmark cases.<br>
