- title: "Natural Language to Protein Database Query"
  date: "Sep. 2024 - Jan. 2025"
  url: https://nl2uniprot.readthedocs.io/en/latest/index.html
  code: https://github.com/qzheng75/NL2UniProt
  year: "Sep. 2024 - Jan. 2025"
  featured: true
  demo: http://www.nl2prot.org/
  pdf: /slides/nl2prot.pdf
  feature-order: 1
  course: "Deep Learning, Bioinformatics"
  feature-title: Natural Language to Protein Database Query
  feature-description: A deep learning architecture that enables natural language descriptions to query protein databases.
  image: /images/featured/nl2prot.png
  cv_description: "Led a 2-person team building a multimodal tool for free-text queries over protein sequences in the UniProt database.<br>
  - Trained a <b>CLIP-style dual encoder (ESM2 + BERT)</b> on a 10k-pair corpus curated by pairing UniProt entries with LLM-generated layman and professional descriptions.<br>
  - Reached <b>94.05% top-50 accuracy</b> on layman queries (vs. 67.33% for an NER/keyword baseline) and cut query latency from over 24 hours to under 40 seconds.<br>
  - Deployed a quantized inference service with <b>Flask</b> and <b>Docker</b> on <b>AWS (ECS/Fargate, ECR, Route 53)</b>, live at nl2prot.org."

